[package]
name = "pkger"
version = "2.1.0"
edition = "2021"
description = "PKGER — Arch Linux package manager (GTK4)"
license = "MIT"

[[bin]]
name = "pkger"
path = "src/pkger.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_10"] }
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
pango = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
